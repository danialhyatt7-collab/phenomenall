<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Phenomenal Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* Dark shell. The page is near-black, panels sit a step above it, and
       cards a step above those — depth comes from these three levels rather
       than from shadows, which read as smudges on a dark ground. */
    --bg:#050505;
    --shell:#0d0d0d;
    --surface:#141414;
    --surface-2:#1c1c1c;
    --sidebar:#101010;
    --ink:#f4f4f5;
    --sub:#a1a1a6;
    --faint:#8b8b92;
    --border:#242424;
    --line-soft:#1e1e1e;
    --accent:#a8e831;          /* lime, used for the live item and nothing else */
    --accent-ink:#0b0f04;
    --accent-soft:rgba(168,232,49,.14);
    --accent-edge:rgba(168,232,49,.34);
    --danger:#ff6b5e;
    --sidebar-sub:#9a9aa0;
    --sidebar-hover:#1a1a1a;
    --sans:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tnum{font-variant-numeric:tabular-nums}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;background:var(--shell)}
  .side{background:var(--sidebar);color:var(--ink);display:flex;flex-direction:column;
    border-right:1px solid var(--border)}
  .side-brand{
    display:flex;align-items:center;padding:16px 18px;
    border-bottom:1px solid var(--border);
  }
  .side-brand .mark{width:132px}

  /* ---------- brand mark ----------
     The artwork is the real chrome render, keyed to transparency so it sits on
     the dark ground with no plate behind it. Everything that moves is layered
     around it rather than baked in, because the render is a flat raster: orbit
     echoes behind, a specular band across, a sparkle tracking the ring. Slow on
     purpose — the mark should read as settled, not busy. */
  .mark{position:relative;display:block;line-height:0}
  .mk-img{display:block;width:100%;height:auto;position:relative;z-index:1}
  .mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
    pointer-events:none}

  /* Orbit echoes: rings bloom out of the mark and fade. */
  .mk-echo{z-index:0}
  .mk-e{fill:none;stroke:#cfd6e2;stroke-width:.7;vector-effect:non-scaling-stroke;
    transform-origin:100px 51px;opacity:0;animation:mk-echo 7s cubic-bezier(.22,.7,.3,1) infinite}
  .mk-e2{animation-delay:2.33s}
  .mk-e3{animation-delay:4.66s}
  @keyframes mk-echo{
    0%{transform:scale(.72);opacity:0}
    18%{opacity:.5}
    100%{transform:scale(1.26);opacity:0}
  }

  /* One hard specular band crossing the metal, masked to the artwork so it
     lights the mark and never the panel behind it. */
  .mk-sheen{
    position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
    background:linear-gradient(102deg,transparent 38%,rgba(255,255,255,.6) 47%,
      rgba(255,255,255,.9) 50%,rgba(255,255,255,.6) 53%,transparent 62%);
    background-size:260% 100%;background-repeat:no-repeat;
    -webkit-mask:url(assets/brand-mark.webp) center/100% 100% no-repeat;
            mask:url(assets/brand-mark.webp) center/100% 100% no-repeat;
    animation:mk-sheen 7s ease-in-out infinite;
  }
  @keyframes mk-sheen{
    0%,8%{background-position:170% 0}
    46%,100%{background-position:-70% 0}
  }

  /* A sparkle riding the ring, left to right. */
  .mk-spark{z-index:3}
  .mk-sp{fill:#fff;opacity:0;animation:mk-spark 11s cubic-bezier(.4,0,.6,1) infinite}
  @keyframes mk-spark{
    0%{transform:translate(14px,64px) scale(.5);opacity:0}
    12%{opacity:.95}
    50%{transform:translate(104px,26px) scale(1.15);opacity:1}
    88%{opacity:.85}
    100%{transform:translate(188px,44px) scale(.5);opacity:0}
  }

  @media(prefers-reduced-motion:reduce){
    .mk-e,.mk-sheen,.mk-sp{animation:none}
    .mk-e,.mk-sp{opacity:0}
    .mk-sheen{display:none}
  }
  .side-sec{padding:18px 18px 6px;font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint)}
  .side nav{display:flex;flex-direction:column;gap:4px;padding:0 12px 16px}
  .side nav a{
    position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-radius:12px;border:1px solid transparent;
    color:var(--sidebar-sub);font-weight:500;font-size:14.5px;
  }
  .side nav a:hover{background:var(--sidebar-hover);color:var(--ink)}
  /* The live item: a lime-tinted slab with a glowing edge bleeding off the
     sidebar's left side, which is what makes it read as lit rather than
     merely selected. */
  .side nav a.on{
    background:linear-gradient(90deg,rgba(168,232,49,.16),rgba(168,232,49,.03));
    border-color:var(--accent-edge);color:#fff;font-weight:600;
  }
  .side nav a.on::before{
    content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);
    width:4px;height:56%;border-radius:4px;background:var(--accent);
    box-shadow:0 0 14px 3px rgba(168,232,49,.55);
  }
  .side nav a.on::after{
    content:"";margin-left:auto;width:7px;height:7px;flex:none;
    border-right:2px solid currentColor;border-top:2px solid currentColor;
    transform:rotate(45deg);opacity:.75;
  }
  /* The chip behind each glyph — circular and outlined, so icons sit on
     their own surface rather than floating in the text line. */
  .side nav .ico{
    width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
    border:1px solid var(--border);background:#161616;
  }
  .side nav a.on .ico{border-color:var(--accent-edge);background:rgba(168,232,49,.1)}
  .side nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .side nav .count{
    margin-left:auto;background:#202020;color:var(--sub);border:1px solid var(--border);
    border-radius:20px;padding:0 8px;font-size:11px;font-weight:600;line-height:19px;
  }
  .side nav a.on .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-color:transparent}
  /* With a count present the chevron would push it off the row, so the
     counted items keep the badge and drop the arrow. */
  .side nav a.on:has(.count)::after{display:none}
  .side-foot{margin-top:auto;padding:16px 18px;border-top:1px solid var(--border);
    color:var(--faint);font-size:11.5px}
  .side-foot a{color:var(--accent)}

  .main{min-width:0;display:flex;flex-direction:column;background:var(--shell)}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:0 24px;min-height:73px;
    background:var(--shell);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:19px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:11px}
  .topbar .spacer{flex:1}
  .btn{
    border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:10px;
    padding:8px 14px;font-size:13px;font-weight:500;
  }
  .btn:hover{background:#262626;border-color:#333}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn-primary:hover{background:#b8f348;border-color:#b8f348}
  .btn-danger{color:var(--danger);border-color:rgba(255,107,94,.32);background:transparent}
  .btn-danger:hover{background:rgba(255,107,94,.1);border-color:var(--danger)}
  .content{padding:24px 24px 64px;max-width:1220px;width:100%}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  .card-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
  .card-head h2{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .card-head .spacer{flex:1}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .kpi .label{color:var(--sub);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
  .kpi .value{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:8px}
  .kpi .foot{color:var(--faint);font-size:11.5px;margin-top:4px}

  /* ---------- tables ---------- */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:680px}
  th{
    text-align:left;font-size:11px;font-weight:600;color:var(--faint);
    letter-spacing:.09em;text-transform:uppercase;
    padding:11px 18px;background:#111;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  td{padding:14px 18px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--surface-2)}
  td .id{font-weight:600}
  td .muted{color:var(--faint);font-size:12.5px}

  /* ---------- pills / tabs ---------- */
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;
    font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.pending{background:rgba(245,180,60,.12);color:#f5b43c;border-color:rgba(245,180,60,.25)}
  .pill.confirmed{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-edge)}
  .pill.shipped{background:rgba(140,140,255,.12);color:#9d9dff;border-color:rgba(140,140,255,.25)}
  .pill.delivered{background:rgba(80,220,150,.12);color:#4fd99a;border-color:rgba(80,220,150,.25)}
  .pill.cancelled{background:#1e1e1e;color:var(--faint);border-color:var(--border)}
  .tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .tabs button{
    background:none;border:1px solid transparent;border-radius:10px;padding:7px 13px;
    font-size:13px;font-weight:500;color:var(--sub);
  }
  .tabs button:hover{background:var(--surface-2);color:var(--ink)}
  .tabs button.on{background:var(--accent-soft);border-color:var(--accent-edge);color:var(--accent);font-weight:600}
  .toolbar{display:flex;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
  .toolbar input{
    flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;
    background:#0f0f0f;color:var(--ink);
  }
  .toolbar input::placeholder{color:var(--faint)}
  .toolbar input:focus{outline:none;border-color:var(--accent-edge);box-shadow:0 0 0 3px rgba(168,232,49,.12)}

  .empty{padding:56px 20px;text-align:center;color:var(--sub)}
  .empty svg{width:34px;height:34px;stroke:#3a3a3a;fill:none;stroke-width:1.5;margin-bottom:10px}
  .empty h3{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .empty p{font-size:13px;max-width:46ch;margin:0 auto}

  /* ---------- order detail ---------- */
  .detail-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;font-weight:500;margin-bottom:6px}
  .back:hover{color:var(--ink)}
  .line-item{display:flex;gap:14px;padding:16px 18px;align-items:center}
  .line-item img{width:52px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:none}
  .line-item .li-t{font-weight:600}
  .line-item .li-s{color:var(--faint);font-size:12.5px;margin-top:2px}
  .line-item .li-p{margin-left:auto;text-align:right;white-space:nowrap}
  .totals{padding:14px 18px;border-top:1px solid var(--line-soft)}
  .totals .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--sub)}
  .totals .row.grand{color:var(--ink);font-weight:700;font-size:15px;border-top:1px solid var(--line-soft);
    margin-top:6px;padding-top:10px}
  .kv{padding:14px 18px;font-size:13px}
  .kv dt{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin-top:13px}
  .kv dt:first-child{margin-top:0}
  .kv dd{margin-top:3px;word-break:break-word}
  .status-actions{padding:14px 18px;display:flex;flex-direction:column;gap:9px}
  .status-actions select{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;
    background:#0f0f0f;color:var(--ink);
  }
  .status-actions select:focus{outline:none;border-color:var(--accent-edge)}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#4fd99a;
    background:rgba(80,220,150,.1);border:1px solid rgba(80,220,150,.22);border-radius:8px;padding:5px 9px;margin-top:8px}

  .prod{display:flex;gap:18px;padding:18px;align-items:flex-start;flex-wrap:wrap}
  .prod img{width:110px;border-radius:10px;border:1px solid var(--border)}
  .prod h3{font-size:15px;font-weight:600}
  .prod .meta{color:var(--sub);font-size:13px;margin-top:6px;max-width:60ch}
  .prod dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:16px}
  .prod dt{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em}
  .prod dd{margin-top:3px;font-size:13.5px}

  .banner{background:rgba(255,107,94,.1);border:1px solid rgba(255,107,94,.28);color:var(--danger);
    border-radius:var(--radius);padding:13px 15px;font-size:13px;margin-bottom:16px;display:none}
  .banner code{background:rgba(0,0,0,.4);border-radius:5px;padding:1px 6px}

  /* ---------- live view ---------- */
  .live-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .live-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);
    font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);
    background:var(--accent-soft);border:1px solid var(--accent-edge);border-radius:100px;padding:5px 12px}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(168,232,49,.6);animation:live-pulse 1.8s ease-out infinite}
  .live-sub{color:var(--faint);font-size:12.5px}
  @keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(168,232,49,.55)}70%{box-shadow:0 0 0 8px rgba(168,232,49,0)}100%{box-shadow:0 0 0 0 rgba(168,232,49,0)}}
  #nav .live-dot{margin-left:auto}
  .live-hot{color:var(--accent)}

  .live-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
  @media(max-width:760px){.live-cols{grid-template-columns:1fr}}

  /* globe */
  .globe-card{margin:16px 0}
  .globe-legend{display:flex;gap:14px;font-size:12px;color:var(--faint)}
  .globe-legend .gl{display:inline-flex;align-items:center;gap:6px}
  .globe-legend .gl::before{content:"";width:8px;height:8px;border-radius:50%}
  .globe-legend .gl-v::before{background:#9d9dff}
  .globe-legend .gl-o::before{background:var(--accent)}
  .globe-wrap{display:grid;grid-template-columns:1fr 220px;gap:8px;padding:8px 12px 4px;align-items:center}
  #live-globe{width:100%;height:380px;display:block;margin:0 auto}
  .globe-side{align-self:center;display:flex;flex-direction:column;gap:2px;min-width:0}
  .gs-row{display:flex;align-items:center;gap:9px;padding:7px 6px;border-bottom:1px solid var(--line-soft)}
  .gs-row:last-child{border-bottom:none}
  .gs-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .gs-dot.gs-o{background:var(--accent)} .gs-dot.gs-v{background:#9d9dff}
  .gs-city{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gs-kind{font-size:11px;color:var(--faint)}
  .globe-note{padding:4px 14px 14px;font-size:11.5px;color:var(--faint)}
  @media(max-width:700px){
    .globe-wrap{grid-template-columns:1fr}
    #live-globe{height:300px}
  }

  .live-spark{display:flex;align-items:flex-end;gap:3px;height:120px;padding:16px 18px}
  .live-spark .sb{flex:1;min-width:0;background:#2a2a2a;border-radius:3px 3px 0 0;transition:height .4s ease}
  .live-spark .sb.now{background:var(--accent);box-shadow:0 0 10px rgba(168,232,49,.5)}

  .live-funnel{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .fn-row .fn-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .fn-row .fn-top b{font-variant-numeric:tabular-nums}
  .fn-bar{height:8px;background:#1c1c1c;border-radius:6px;overflow:hidden}
  .fn-bar span{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--accent),#7fb327);transition:width .5s ease}

  .live-feed{padding:6px 0}
  .fe-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-soft)}
  .fe-row:last-child{border-bottom:none}
  .fe-ic{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
  .fe-ViewContent{background:#9d9dff}.fe-AddToCart{background:#f5b43c}
  .fe-InitiateCheckout{background:var(--accent)}.fe-Contact{background:#4fd99a}.fe-PageView{background:#5a5a5a}
  .fe-t{flex:1;font-size:13.5px}
  .fe-ago{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  .live-empty{padding:34px 18px;text-align:center;color:var(--faint);font-size:13px}

  /* ---------- session replay ---------- */
  .replay-stage{padding:14px 16px;display:flex;justify-content:center;min-height:200px}
  .replay-stage .rr-player{box-shadow:none;border-radius:10px;overflow:hidden;max-width:100%}
  .replay-stage .rr-controller{background:#141414;color:var(--ink)}
  .replay-stage .rr-timeline__time{color:var(--sub)}

  /* ---------- sign in ---------- */
  .login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:50}
  /* display:grid above outranks the browser's own [hidden]{display:none}, so
     without this the overlay stays on screen after a successful sign-in and
     the dashboard is unreachable. */
  .login[hidden]{display:none}
  .login-card{width:100%;max-width:368px;background:var(--surface);border:1px solid var(--border);
    border-radius:18px;box-shadow:var(--shadow);padding:30px 28px}
  .login-brand{display:flex;align-items:center}
  .login-brand .mark{width:156px}
  .login h2{font-size:18px;font-weight:600;margin-top:22px;letter-spacing:-.015em}
  .login .sub{color:var(--sub);font-size:13px;margin-top:4px}
  .login .field{margin-top:16px}
  .login label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--sub)}
  .login input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    font:inherit;font-size:14px;background:#0f0f0f;color:var(--ink)}
  .login input:focus{outline:none;border-color:var(--accent-edge);box-shadow:0 0 0 3px rgba(168,232,49,.12)}
  .login button{width:100%;margin-top:20px;padding:10px 12px}
  .login .err{background:rgba(255,107,94,.1);border:1px solid rgba(255,107,94,.28);color:var(--danger);
    border-radius:10px;padding:10px 12px;font-size:13px;margin-top:16px;display:none}
  .who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--sub);font-size:12px;
    padding:12px 0 0;border-top:1px solid var(--border);margin-top:12px}
  /* Side by side, a username the length of the real one squeezed both halves
     until each broke across two lines. The sidebar is not wide enough to fit
     them on one row without truncating the name, so they get a row each. */
  .who .lbl{flex:1 1 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who b{color:var(--ink);font-weight:600}
  .who button{flex:none;white-space:nowrap;
    background:var(--surface-2);border:1px solid var(--border);color:var(--sub);
    border-radius:8px;padding:5px 12px;font-size:11.5px}
  .who button:hover{background:#262626;color:var(--ink)}

  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    /* The sidebar becomes a header. It wraps onto two rows rather than
       scrolling sideways: a scrolling nav hid Products and Customers off the
       right edge of a phone with nothing to indicate they were there. */
    .side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;overflow:visible;
      padding:10px 12px;border-right:none;border-bottom:1px solid var(--border)}
    .side-brand{order:0;padding:0;border-bottom:none}
    .side-brand .mark{width:104px}
    .side-sec{display:none}
    .side nav{order:2;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;gap:6px;padding:0}
    .side nav a{white-space:nowrap;padding:7px 11px;gap:8px;font-size:13.5px}
    .side nav a.on::before,.side nav a.on::after{display:none}
    .side nav .ico{width:26px;height:26px}
    .side nav svg{width:15px;height:15px}
    .side nav .count{margin-left:0}
    /* Sign out was unreachable on a phone — the whole footer was hidden. Only
       the storefront blurb goes; the control itself moves up beside the brand. */
    .side-foot{order:1;display:block;margin:0 0 0 auto;padding:0;border-top:none;width:auto}
    .foot-note{display:none}
    .who{margin:0;padding:0;border-top:none;gap:0}
    .who .lbl{display:none}
    .content{padding:18px 14px 54px}
    .topbar{padding:0 14px;min-height:62px}
  }
  /* Four stacked KPI cards pushed the orders table off a phone screen. */
  @media(max-width:600px){
    .kpis{grid-template-columns:1fr 1fr;gap:10px}
    .kpi{padding:14px}
    .kpi .value{font-size:21px}
    .kpi .label,.kpi .foot{font-size:11.5px}
    /* The table keeps its sideways scroll — it is a data table and that is
       the honest way to show six columns on a phone — but tighter cells fit
       more per swipe, and an order ID must never break across two lines. */
    th,td{padding:11px 12px}
    table{min-width:560px}
    td .id{white-space:nowrap}
    .card-head,.toolbar{padding-left:14px;padding-right:14px}
    .detail-grid{gap:12px}
  }
</style>
</head>

<script>
(function(){
  "use strict";
  var STATUSES = ["pending","confirmed","shipped","delivered","cancelled"];
  var NEXT = {pending:"confirmed", confirmed:"shipped", shipped:"delivered"};
  var state = {orders:[], customers:[], products:[], stats:{}, filter:"all", q:""};

  var $ = function(s){ return document.querySelector(s); };
  function esc(v){ var d=document.createElement("div"); d.textContent = v==null?"":String(v); return d.innerHTML; }
  function money(n){ return "Rs " + (n||0).toLocaleString("en-PK"); }
  function when(iso){
    var d = new Date(iso);
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + ", " +
           d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }
  function pill(s){ return '<span class="pill '+esc(s)+'">'+esc(s)+'</span>'; }

  /* ---------- data ---------- */
  function grab(url){
    return fetch(url).then(function(r){
      if(r.status === 401){ var e = new Error("unauthorised"); e.auth = true; throw e; }
      return r.json();
    });
  }
  function load(){
    return Promise.all([
      grab("/api/orders"), grab("/api/stats"), grab("/api/products"), grab("/api/customers")
    ]).then(function(res){
      state.orders = res[0]; state.stats = res[1]; state.products = res[2]; state.customers = res[3];
      $("#banner").style.display = "none";
      $("#nav-orders").textContent = state.orders.length;
      $("#nav-customers").textContent = state.customers.length;
      render();
    }).catch(function(err){
      if(err && err.auth) return showLogin();      // session expired mid-session
      $("#banner").style.display = "block";
    });
  }

  /* ---------- sign in ---------- */
  function showLogin(msg){
    $("#app").style.display = "none";
    $("#login").hidden = false;
    var box = $("#login-err");
    box.textContent = msg || "";
    box.style.display = msg ? "block" : "none";
    var u = $("#u"); if(u && !u.value) u.focus();
  }
  function showApp(user){
    $("#login").hidden = true;
    $("#app").style.display = "";
    $("#who").textContent = user;
    load();
  }
  $("#login-form").addEventListener("submit", function(e){
    e.preventDefault();
    var btn = $("#login-btn");
    btn.disabled = true; btn.textContent = "Signing in…";
    fetch("/api/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username: $("#u").value, password: $("#pw").value})
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        btn.disabled = false; btn.textContent = "Sign in";
        if(res.ok){ $("#pw").value = ""; showApp(res.d.user); }
        else showLogin(res.d.error || "Could not sign in.");
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = "Sign in";
        showLogin("Can't reach the server. Is it running?");
      });
  });
  $("#signout").addEventListener("click", function(){
    fetch("/api/logout", {method:"POST"}).then(function(){ showLogin(); });
  });

  /* ---------- views ---------- */
  function emptyState(title, msg){
    return '<div class="card"><div class="empty">'+
      '<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9.5 7V5.5a2.5 2.5 0 0 1 5 0V7"/></svg>'+
      '<h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p></div></div>';
  }

  function kpiRow(){
    var s = state.stats;
    return '<div class="kpis">'+
      kpi("Total sales", money(s.revenue), "Excludes cancelled orders")+
      kpi("Orders", s.orders||0, (s.last7||0)+" in the last 7 days")+
      kpi("Units sold", s.units||0, "Across all sizes")+
      kpi("Average order", money(s.aov), "Per completed order")+
    '</div>';
  }
  function kpi(label, value, foot){
    return '<div class="kpi"><div class="label">'+esc(label)+'</div>'+
      '<div class="value tnum">'+esc(value)+'</div><div class="foot">'+esc(foot)+'</div></div>';
  }

  function ordersTable(list, showAll){
    if(!list.length){
      return emptyState("No orders here yet",
        showAll ? "As soon as someone checks out on the storefront, their order lands in this list."
                : "No orders match this filter.");
    }
    var rows = list.map(function(o){
      return '<tr class="click" data-id="'+esc(o.id)+'">'+
        '<td><span class="id">'+esc(o.id)+'</span></td>'+
        '<td class="muted">'+esc(when(o.created_at))+'</td>'+
        '<td>'+esc(o.name || "Guest")+'<div class="muted">'+esc(o.phone || o.email || "no contact")+'</div></td>'+
        '<td class="muted">'+esc(o.size)+' &times; '+esc(o.qty)+'</td>'+
        '<td class="tnum">'+esc(money(o.total))+'</td>'+
        '<td>'+pill(o.status)+'</td>'+
      '</tr>';
    }).join("");
    return '<div class="tbl-wrap"><table><thead><tr>'+
      '<th>Order</th><th>Date</th><th>Customer</th><th>Item</th><th>Total</th><th>Status</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

     are doing, and today's takings. It polls /api/live every few seconds while
     this view is open and stops the moment you leave it. */

        '<div class="globe-wrap"><canvas id="live-globe"></canvas>'+

      '<div class="live-cols">'+
        '<div class="card"><div class="card-head"><h2>Sessions</h2><span class="spacer"></span><span class="muted" style="font-size:12px;color:var(--faint)">Pageviews · last 30 min</span></div>'+
          '<div class="live-spark" id="live-spark"></div></div>'+
        '<div class="card"><div class="card-head"><h2>Customer behaviour</h2><span class="spacer"></span><span class="muted" style="font-size:12px;color:var(--faint)">Last 30 min</span></div>'+
          '<div class="live-funnel" id="live-funnel"></div></div>'+
      '</div>'+
      '<div class="card"><div class="card-head"><h2>Activity</h2></div>'+
        '<div class="live-feed" id="live-feed"><div class="live-empty">Waiting for the first visitor…</div></div></div>';
  }
  function liveTile(v,l){ return '<div class="kpi"><div class="label">'+esc(l)+'</div><div class="value">'+v+'</div></div>'; }

  var LIVE_LABELS = {ViewContent:"Product viewed", AddToCart:"Added to cart", InitiateCheckout:"Checkout started", Contact:"Tapped WhatsApp", PageView:"Page viewed"};
  function ago(s){ if(s<60) return s+"s ago"; var m=Math.floor(s/60); return m+"m ago"; }

  function liveStart(){
    liveStop();
    liveTick();
    liveTimer = setInterval(liveTick, 5000);
    globeStart();
  }
  function liveStop(){
    if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
    globeStop();
    var dot = document.getElementById("nav-live-dot"); if(dot) dot.hidden = true;
  }

  var _landBits = null, LAND_DOTS = null;
  function isLand(lat, lon){
    var W = 360, H = 180;
    var col = Math.floor((lon + 180) / 360 * W); col = ((col % W) + W) % W;
    var row = Math.floor((90 - lat) / 180 * H); if(row < 0) row = 0; else if(row >= H) row = H - 1;
    var idx = row * W + col;
    return (_landBits[idx >> 3] >> (7 - (idx & 7))) & 1;
  }
  function landInit(){
    if(LAND_DOTS) return;
    var bin = atob(LANDMASK); _landBits = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) _landBits[i] = bin.charCodeAt(i);
    // Even-area sampling: widen the longitude step toward the poles so the dots
    // do not bunch up at the top and bottom.
    LAND_DOTS = [];
    for(var lat = -82; lat <= 82; lat += 1.7){
      var step = 1.7 / Math.max(Math.cos(lat * Math.PI / 180), 0.13);
      for(var lon = -180; lon < 180; lon += step){ if(isLand(lat, lon)) LAND_DOTS.push([lat, lon]); }
    }
  }

  function globeStart(){
    var c = document.getElementById("live-globe");
    if(!c || globeRAF) return;
    landInit();
    var last = performance.now(), acc = 0;
    function frame(now){
      globeRAF = requestAnimationFrame(frame);
      var dt = Math.min(now - last, 60); last = now;
      globeRot += dt * 0.00012;              // a slow, steady turn
      acc += dt; if(acc < 33) return; acc = 0; // ~30fps is plenty for a globe
      globeDraw(c, now);
    }
    globeRAF = requestAnimationFrame(frame);
  }
  function globeStop(){ if(globeRAF){ cancelAnimationFrame(globeRAF); globeRAF = null; } }

  function project(latDeg, lonDeg, rot){
    var lat = latDeg*Math.PI/180, lon = lonDeg*Math.PI/180 + rot;
    var x = Math.cos(lat)*Math.sin(lon), y = Math.sin(lat), z = Math.cos(lat)*Math.cos(lon);
    var ct = Math.cos(globeTilt), st = Math.sin(globeTilt);
    return {x:x, y:y*ct - z*st, z:y*st + z*ct};   // z > 0 faces the viewer
  }

  function globeDraw(c, now){
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    var box = c.getBoundingClientRect();
    var w = box.width, h = box.height;
    if(!w || !h) return;
    if(c.width !== Math.round(w*dpr)){ c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); }
    var g = c.getContext("2d");
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);
    var cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 10;

    // atmosphere halo
    var atm = g.createRadialGradient(cx,cy,R*0.82, cx,cy,R*1.16);
    atm.addColorStop(0,"rgba(120,150,180,0)"); atm.addColorStop(0.7,"rgba(120,150,180,.05)"); atm.addColorStop(1,"rgba(168,232,49,.08)");
    g.fillStyle = atm; g.beginPath(); g.arc(cx,cy,R*1.16,0,7); g.fill();

    // ocean sphere — a dark, faintly lit ball
    var body = g.createRadialGradient(cx-R*0.32,cy-R*0.36,R*0.15, cx,cy,R);
    body.addColorStop(0,"#141a20"); body.addColorStop(0.65,"#0d1116"); body.addColorStop(1,"#080a0d");
    g.fillStyle = body; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();

    // land as dots
    var dotR = Math.max(R*0.0075, 0.8);
    for(var i=0;i<LAND_DOTS.length;i++){
      var pr = project(LAND_DOTS[i][0], LAND_DOTS[i][1], globeRot);
      if(pr.z <= 0.04) continue;
      var a = 0.10 + 0.52*pr.z;
      g.fillStyle = "rgba(126,140,148," + a.toFixed(3) + ")";
      g.beginPath(); g.arc(cx+pr.x*R, cy-pr.y*R, dotR, 0, 7); g.fill();
    }

    // rim
    g.strokeStyle="rgba(168,232,49,.16)"; g.lineWidth=1; g.beginPath(); g.arc(cx,cy,R,0,7); g.stroke();

    // points — visitors and orders
    var pulse = 0.5 + 0.5*Math.sin(now*0.0038);
    globePoints.forEach(function(p){
      var pr = project(p.lat, p.lon, globeRot);
      if(pr.z <= 0.03) return;
      var sx = cx+pr.x*R, sy = cy-pr.y*R;
      var order = p.kind === "order";
      var col = order ? "168,232,49" : "150,150,255";
      var fade = 0.45 + 0.55*pr.z;
      var base = (order ? R*0.02 : R*0.014);
      if(base < (order?3.2:2.4)) base = (order?3.2:2.4);
      // glow halo
      var halo = g.createRadialGradient(sx,sy,0, sx,sy, base*4.5);
      halo.addColorStop(0,"rgba("+col+","+(0.5*fade)+")"); halo.addColorStop(1,"rgba("+col+",0)");
      g.fillStyle = halo; g.beginPath(); g.arc(sx,sy,base*4.5,0,7); g.fill();
      if(order){
        var rr = base + pulse*base*2.6;
        g.strokeStyle="rgba("+col+","+(0.55*(1-pulse)*fade)+")"; g.lineWidth=1.5;
        g.beginPath(); g.arc(sx,sy,rr,0,7); g.stroke();
      }
      g.fillStyle = "rgba(255,255,255,"+(0.9*fade)+")";
      g.beginPath(); g.arc(sx,sy,base*0.5,0,7); g.fill();
      g.fillStyle = "rgba("+col+","+fade+")";
      g.beginPath(); g.arc(sx,sy,base,0,7); g.fill();
    });
  }

  function liveTick(){
    grab("/api/live").then(function(d){
      if(route().view !== "live") return;   // navigated away mid-request
      liveRender(d);
    }).catch(function(err){ if(err && err.auth) showLogin(); });
  }

  function liveRender(d){
    var dot = $("#nav-live-dot"); if(dot) dot.hidden = d.visitorsNow === 0;
    var up = $("#live-updated"); if(up) up.textContent = "Updated " + new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",second:"2-digit"});
    var kp = $("#live-kpis");
    if(kp) kp.innerHTML = liveTile('<span class="'+(d.visitorsNow?"live-hot":"")+'">'+d.visitorsNow+'</span>',"Visitors now")+
      liveTile(d.views30,"Views · 30 min")+liveTile(d.ordersToday,"Orders today")+liveTile(money(d.salesToday),"Sales today");

    // sparkline
    var sp = $("#live-spark");
    if(sp){
      var max = Math.max.apply(null, d.perMinute.concat([1]));
      sp.innerHTML = d.perMinute.map(function(v,i){
        var h = Math.round(v/max*100);
        return '<span class="sb'+(i===d.perMinute.length-1?" now":"")+'" style="height:'+Math.max(h,3)+'%" title="'+v+'"></span>';
      }).join("");
    }

    // funnel
    var fn = $("#live-funnel");
    if(fn){
      var rows = [["Product viewed",d.funnel.view],["Added to cart",d.funnel.cart],["Reached checkout",d.funnel.checkout],["Tapped WhatsApp",d.funnel.contact]];
      var top = Math.max(rows[0][1],1);
      fn.innerHTML = rows.map(function(r){
        var pct = Math.round(r[1]/top*100);
        return '<div class="fn-row"><div class="fn-top"><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></div>'+
          '<div class="fn-bar"><span style="width:'+Math.max(pct,2)+'%"></span></div></div>';
      }).join("");
    }

    // globe
    globePoints = (d.geo || []).slice();
    var side = $("#globe-side");
    if(side){
      // a compact list of the newest located points, order pins first
      var pts = globePoints.slice().sort(function(a,b){ return (a.kind==="order"?0:1)-(b.kind==="order"?0:1) || a.ago-b.ago; }).slice(0,8);
      side.innerHTML = pts.length ? pts.map(function(p){
        return '<div class="gs-row"><span class="gs-dot '+(p.kind==="order"?"gs-o":"gs-v")+'"></span>'+
          '<span class="gs-city">'+esc(p.city||"Unknown")+'</span>'+
          '<span class="gs-kind">'+(p.kind==="order"?"order":"viewing")+'</span></div>';
      }).join("") : '<div class="live-empty" style="padding:20px 6px">No located activity yet.</div>';
    }
    var note = $("#globe-note");
    if(note){
      var located = d.located||0, coarse = (d.geo||[]).filter(function(p){return p.kind==="visitor";}).length;
      note.textContent = "Orders placed on their delivery city. Live visitors shown by timezone — Pakistan resolves to one point.";
    }

    // activity feed
    var fd = $("#live-feed");
    if(fd){
      if(!d.feed.length){ fd.innerHTML = '<div class="live-empty">Quiet right now — no activity in the last 30 minutes.</div>'; }
      else fd.innerHTML = d.feed.map(function(e){
        return '<div class="fe-row"><span class="fe-ic fe-'+e.n+'"></span><span class="fe-t">'+esc(LIVE_LABELS[e.n]||e.n)+'</span><span class="fe-ago">'+ago(e.ago)+'</span></div>';
      }).join("");
    }
  }

  /* ---------- session replay ----------
     Lists the recordings the storefront captured and plays one back with
     rrweb-player. The player and its stylesheet load only when you open a
     replay — they never touch the rest of the admin. */
  function viewSessions(){
    return '<div class="card"><div class="card-head"><h2>Session replays</h2><span class="spacer"></span>'+
        '<span class="muted" style="font-size:12px;color:var(--faint)">Engaged visits only · newest first</span></div>'+
      '<div id="sess-list"><div class="live-empty" style="padding:40px 18px">Loading…</div></div></div>';
  }
  function fmtDur(ms){ var s=Math.round(ms/1000); if(s<60) return s+"s"; var m=Math.floor(s/60); return m+"m "+(s%60)+"s"; }
  function device(ua, vw){
    ua = ua||""; var mob = /Mobi|Android|iPhone|iPad/i.test(ua) || (vw && vw<700);
    var os = /iPhone|iPad|iOS/i.test(ua) ? "iOS" : /Android/i.test(ua) ? "Android" : /Windows/i.test(ua) ? "Windows" : /Mac/i.test(ua) ? "Mac" : "";
    return (mob?"Mobile":"Desktop") + (os?" · "+os:"");
  }
  function engagedLabel(e){
    return {"viewed-product":"Viewed product","opened-sizing":"Opened sizing","checkout":"Checkout"}[e] || (e||"Engaged");
  }
  function loadSessions(){
    grab("/api/rec").then(function(list){
      if(route().view !== "sessions" || route().id) return;
      var el = $("#sess-list"); if(!el) return;
      if(!list.length){ el.innerHTML = '<div class="live-empty" style="padding:44px 18px"><h3>No recordings yet</h3><p>A replay is saved once a visitor engages — reaches the product, opens sizing, or starts checkout.</p></div>'; return; }
      el.innerHTML = '<div class="tbl-wrap"><table><thead><tr>'+
          '<th>When</th><th>Duration</th><th>Device</th><th>Engaged</th><th>Pages</th><th>Outcome</th><th></th></tr></thead><tbody>'+
        list.map(function(m){
          return '<tr class="click" data-sid="'+esc(m.sid)+'">'+
            '<td><span class="id">'+esc(when(m.start))+'</span></td>'+
            '<td class="tnum">'+esc(fmtDur(m.duration))+'</td>'+
            '<td>'+esc(device(m.ua, m.vw))+'</td>'+
            '<td>'+esc(engagedLabel(m.engaged))+'</td>'+
            '<td class="tnum">'+esc(m.pages||1)+'</td>'+
            '<td>'+(m.ordered ? '<span class="pill confirmed">ordered</span>' : '<span class="pill cancelled">no order</span>')+'</td>'+
            '<td style="text-align:right"><button class="btn btn-danger" data-del-rec="'+esc(m.sid)+'">Delete</button></td>'+
          '</tr>';
        }).join("")+'</tbody></table></div>';
    }).catch(function(err){ if(err && err.auth) showLogin(); });
  }

  function viewReplay(sid){
    return '<a class="back" href="#/sessions">&larr; All sessions</a>'+
      '<div class="card"><div class="card-head"><h2>Session replay</h2><span class="spacer"></span>'+
        '<span class="muted" id="replay-meta" style="font-size:12px;color:var(--faint)"></span></div>'+
      '<div class="replay-stage" id="replay-stage"><div class="live-empty" style="padding:40px 18px">Loading replay…</div></div></div>'+
      '<p class="globe-note" style="padding:12px 2px 0">Form fields were masked while recording — you can see where a visitor hesitated or dropped off, never what they typed.</p>';
  }
  var replayInst = null;
  function replayStop(){
    if(replayInst){ try{ replayInst.pause && replayInst.pause(); }catch(e){} replayInst = null; }
    var st = document.getElementById("replay-stage"); if(st) st.innerHTML = "";
  }
  function loadPlayerAssets(cb){
    if(!document.getElementById("rrweb-player-css")){
      var l = document.createElement("link"); l.id="rrweb-player-css"; l.rel="stylesheet"; l.href="vendor/rrweb-player.css";
      document.head.appendChild(l);
    }
    if(window.rrwebPlayer){ cb(); return; }
    var s = document.createElement("script"); s.src="vendor/rrweb-player.min.js"; s.async=true;
    s.onload=function(){ cb(); }; s.onerror=function(){ cb(new Error("player failed to load")); };
    document.head.appendChild(s);
  }
  function replayStart(sid){
    grab("/api/rec/"+sid).then(function(rec){
      if(route().view !== "sessions" || route().id !== sid) return;
      var meta = $("#replay-meta"); if(meta && rec.meta) meta.textContent = device(rec.meta.ua, rec.meta.vw) + " · " + fmtDur(rec.meta.last - rec.meta.start);
      if(!rec.events || rec.events.length < 2){
        var st0 = $("#replay-stage"); if(st0) st0.innerHTML = '<div class="live-empty" style="padding:40px 18px">This recording is too short to play.</div>';
        return;
      }
      loadPlayerAssets(function(err){
        var st = $("#replay-stage"); if(!st || route().id !== sid) return;
        if(err || !window.rrwebPlayer){ st.innerHTML = '<div class="live-empty" style="padding:40px 18px">Could not load the player.</div>'; return; }
        st.innerHTML = "";
        var w = Math.min(st.clientWidth || 900, 1000);
        try{
          replayInst = new window.rrwebPlayer({
            target: st,
            props: { events: rec.events, width: w, height: Math.round(w*0.6), autoPlay: true, showController: true }
          });
        }catch(e){ st.innerHTML = '<div class="live-empty" style="padding:40px 18px">This recording could not be played.</div>'; }
      });
    }).catch(function(err){ if(err && err.auth) showLogin(); });
  }
  function delRec(sid){
    if(!confirm("Delete this recording?")) return;
    fetch("/api/rec/"+sid, {method:"DELETE"}).then(function(){ loadSessions(); });
  }

  /* ---------- routing ---------- */
  function route(){
    var h = (location.hash || "#/home").replace(/^#\//,"").split("/");
    return {view: h[0] || "home", id: h[1] || null};
  }
  function render(){
    var r = route(), html, title;
    // The live view owns its own DOM and refresh loop. A background load()
    // must not tear it down and reprint placeholders, so if it is already up,
    // just make sure the poll is running and leave it be.
    if(r.view === "live" && document.getElementById("live-kpis")){ liveStart(); return; }
    liveStop(); replayStop();
    if(r.view === "live"){ html = viewLive(); title = "Live"; }
    else if(r.view === "sessions" && r.id){ html = viewReplay(r.id); title = "Session replay"; }
    else if(r.view === "sessions"){ html = viewSessions(); title = "Sessions"; }
    else if(r.view === "orders" && r.id){ html = viewOrder(r.id); title = "Order " + r.id; }
    else if(r.view === "orders"){ html = viewOrders(); title = "Orders"; }
    else if(r.view === "products"){ html = viewProducts(); title = "Products"; }
    else if(r.view === "customers"){ html = viewCustomers(); title = "Customers"; }
    else { html = viewHome(); title = "Home"; }
    $("#view").innerHTML = html;
    // Start the live loop only after its DOM (canvas included) is in the page.
    if(r.view === "live") liveStart();
    else if(r.view === "sessions" && r.id) replayStart(r.id);
    else if(r.view === "sessions") loadSessions();
    $("#page-title").textContent = title;
    document.querySelectorAll("#nav a").forEach(function(a){
      a.classList.toggle("on", a.dataset.view === (r.view || "home"));
    });
    $("#export").style.display = (r.view === "orders" && !r.id) ? "" : "none";
  }
  window.addEventListener("hashchange", render);

  /* ---------- interactions ---------- */
  $("#view").addEventListener("click", function(e){
    var delRecBtn = e.target.closest("[data-del-rec]");
    if(delRecBtn){ e.stopPropagation(); delRec(delRecBtn.dataset.delRec); return; }
    var row = e.target.closest("tr.click");
    if(row && row.dataset.sid){ location.hash = "#/sessions/" + row.dataset.sid; return; }
    if(row){ location.hash = "#/orders/" + row.dataset.id; return; }
    var tab = e.target.closest("[data-filter]");
    if(tab){ state.filter = tab.dataset.filter; render(); return; }
    var adv = e.target.closest("[data-advance]");
    if(adv){ setStatus(route().id, adv.dataset.advance); }
    var del = e.target.closest("[data-delete]");
    if(del){ removeOrder(del.dataset.delete); }
  });
  $("#view").addEventListener("input", function(e){
    if(e.target.id === "q"){
      state.q = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var box = $("#q"); if(box){ box.focus(); box.setSelectionRange(pos,pos); }
    }
  });
  $("#view").addEventListener("change", function(e){
    if(e.target.id === "status-select") setStatus(route().id, e.target.value);
  });

  // Used to clear test rows. Permanent, and a Purchase already reported to
  // Meta stays reported — deleting the row here cannot take it back.
  function removeOrder(id){
    var o = state.orders.filter(function(x){ return x.id === id; })[0];
    var reported = o && o.capi && o.capi.purchase_sent_at;
    if(!confirm("Delete order " + id + " for good?" +
      (reported ? "\n\nThis order already reported a Purchase to Meta. Deleting it here does not withdraw that event." : ""))) return;
    fetch("/api/orders/"+id, {method:"DELETE"}).then(function(){
      location.hash = "#/orders";
      load();
    });
  }

  function setStatus(id, status){
    fetch("/api/orders/"+id, {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({status: status})
    }).then(load);
  }

  $("#refresh").addEventListener("click", function(){ load(); if(route().view === "live") liveTick(); });
  $("#export").addEventListener("click", function(){
    var cols = ["id","created_at","status","product","size","qty","unit_price","total","name","phone","email","address","marketing_opt_in","channel"];
    var csv = [cols.join(",")].concat(state.orders.map(function(o){
      return cols.map(function(c){
        var v = o[c] == null ? "" : String(o[c]);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
      }).join(",");
    })).join("\n");
    var url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    var a = document.createElement("a");
    a.href = url; a.download = "phenomenal-orders.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  fetch("/api/me")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ d ? showApp(d.user) : showLogin(); })
    .catch(function(){ showLogin(); });

  // Pause the live poll when the tab is hidden; resume on return.
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) liveStop();
    else if(route().view === "live" && !$("#login").hidden) liveStart();
  });

  setInterval(function(){ if(!$("#login").hidden) return; load(); }, 20000);
})();
</script>
</body>
</html>
