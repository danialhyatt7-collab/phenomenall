<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Phenomenal Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* Dark shell. The page is near-black, panels sit a step above it, and
       cards a step above those — depth comes from these three levels rather
       than from shadows, which read as smudges on a dark ground. */
    --bg:#050505;
    --shell:#0d0d0d;
    --surface:#141414;
    --surface-2:#1c1c1c;
    --sidebar:#101010;
    --ink:#f4f4f5;
    --sub:#a1a1a6;
    --faint:#8b8b92;
    --border:#242424;
    --line-soft:#1e1e1e;
    --accent:#a8e831;          /* lime, used for the live item and nothing else */
    --accent-ink:#0b0f04;
    --accent-soft:rgba(168,232,49,.14);
    --accent-edge:rgba(168,232,49,.34);
    --danger:#ff6b5e;
    --sidebar-sub:#9a9aa0;
    --sidebar-hover:#1a1a1a;
    --sans:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tnum{font-variant-numeric:tabular-nums}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;background:var(--shell)}
  .side{background:var(--sidebar);color:var(--ink);display:flex;flex-direction:column;
    border-right:1px solid var(--border)}
  .side-brand{
    display:flex;align-items:center;padding:16px 18px;
    border-bottom:1px solid var(--border);
  }
  .side-brand .mark{width:132px}

  /* ---------- brand mark ---------- */
  .mark{display:block;height:auto;overflow:visible}
  .pm-spec{opacity:.35;animation:pm-spec 9s ease-in-out infinite}
  .pm-spec-b{animation-delay:-4.5s}
  .pm-star{transform-box:fill-box;transform-origin:center;animation:pm-tw 6s ease-in-out infinite}
  .pm-glint{opacity:.3;animation:pm-glint 6s ease-in-out infinite}
  @keyframes pm-spec{0%,100%{opacity:.3}45%{opacity:1}}
  @keyframes pm-tw{0%,74%,100%{transform:scale(1)}86%{transform:scale(1.07)}}
  @keyframes pm-glint{0%,72%,100%{opacity:.25}86%{opacity:1}}
  @media(prefers-reduced-motion:reduce){
    .pm-spec,.pm-star,.pm-glint{animation:none}
    .pm-spec,.pm-glint{opacity:.7}
  }
  .side-sec{padding:18px 18px 6px;font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint)}
  .side nav{display:flex;flex-direction:column;gap:4px;padding:0 12px 16px}
  .side nav a{
    position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-radius:12px;border:1px solid transparent;
    color:var(--sidebar-sub);font-weight:500;font-size:14.5px;
  }
  .side nav a:hover{background:var(--sidebar-hover);color:var(--ink)}
  /* The live item: a lime-tinted slab with a glowing edge bleeding off the
     sidebar's left side, which is what makes it read as lit rather than
     merely selected. */
  .side nav a.on{
    background:linear-gradient(90deg,rgba(168,232,49,.16),rgba(168,232,49,.03));
    border-color:var(--accent-edge);color:#fff;font-weight:600;
  }
  .side nav a.on::before{
    content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);
    width:4px;height:56%;border-radius:4px;background:var(--accent);
    box-shadow:0 0 14px 3px rgba(168,232,49,.55);
  }
  .side nav a.on::after{
    content:"";margin-left:auto;width:7px;height:7px;flex:none;
    border-right:2px solid currentColor;border-top:2px solid currentColor;
    transform:rotate(45deg);opacity:.75;
  }
  /* The chip behind each glyph — circular and outlined, so icons sit on
     their own surface rather than floating in the text line. */
  .side nav .ico{
    width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
    border:1px solid var(--border);background:#161616;
  }
  .side nav a.on .ico{border-color:var(--accent-edge);background:rgba(168,232,49,.1)}
  .side nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .side nav .count{
    margin-left:auto;background:#202020;color:var(--sub);border:1px solid var(--border);
    border-radius:20px;padding:0 8px;font-size:11px;font-weight:600;line-height:19px;
  }
  .side nav a.on .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-color:transparent}
  /* With a count present the chevron would push it off the row, so the
     counted items keep the badge and drop the arrow. */
  .side nav a.on:has(.count)::after{display:none}
  .side-foot{margin-top:auto;padding:16px 18px;border-top:1px solid var(--border);
    color:var(--faint);font-size:11.5px}
  .side-foot a{color:var(--accent)}

  .main{min-width:0;display:flex;flex-direction:column;background:var(--shell)}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:0 24px;min-height:73px;
    background:var(--shell);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:19px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:11px}
  .topbar .spacer{flex:1}
  .btn{
    border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:10px;
    padding:8px 14px;font-size:13px;font-weight:500;
  }
  .btn:hover{background:#262626;border-color:#333}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn-primary:hover{background:#b8f348;border-color:#b8f348}
  .btn-danger{color:var(--danger);border-color:rgba(255,107,94,.32);background:transparent}
  .btn-danger:hover{background:rgba(255,107,94,.1);border-color:var(--danger)}
  .content{padding:24px 24px 64px;max-width:1220px;width:100%}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  .card-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
  .card-head h2{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .card-head .spacer{flex:1}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .kpi .label{color:var(--sub);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
  .kpi .value{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:8px}
  .kpi .foot{color:var(--faint);font-size:11.5px;margin-top:4px}

  /* ---------- tables ---------- */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:680px}
  th{
    text-align:left;font-size:11px;font-weight:600;color:var(--faint);
    letter-spacing:.09em;text-transform:uppercase;
    padding:11px 18px;background:#111;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  td{padding:14px 18px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--surface-2)}
  td .id{font-weight:600}
  td .muted{color:var(--faint);font-size:12.5px}

  /* ---------- pills / tabs ---------- */
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;
    font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.pending{background:rgba(245,180,60,.12);color:#f5b43c;border-color:rgba(245,180,60,.25)}
  .pill.confirmed{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-edge)}
  .pill.shipped{background:rgba(140,140,255,.12);color:#9d9dff;border-color:rgba(140,140,255,.25)}
  .pill.delivered{background:rgba(80,220,150,.12);color:#4fd99a;border-color:rgba(80,220,150,.25)}
  .pill.cancelled{background:#1e1e1e;color:var(--faint);border-color:var(--border)}
  .tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .tabs button{
    background:none;border:1px solid transparent;border-radius:10px;padding:7px 13px;
    font-size:13px;font-weight:500;color:var(--sub);
  }
  .tabs button:hover{background:var(--surface-2);color:var(--ink)}
  .tabs button.on{background:var(--accent-soft);border-color:var(--accent-edge);color:var(--accent);font-weight:600}
  .toolbar{display:flex;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
  .toolbar input{
    flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;
    background:#0f0f0f;color:var(--ink);
  }
  .toolbar input::placeholder{color:var(--faint)}
  .toolbar input:focus{outline:none;border-color:var(--accent-edge);box-shadow:0 0 0 3px rgba(168,232,49,.12)}

  .empty{padding:56px 20px;text-align:center;color:var(--sub)}
  .empty svg{width:34px;height:34px;stroke:#3a3a3a;fill:none;stroke-width:1.5;margin-bottom:10px}
  .empty h3{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .empty p{font-size:13px;max-width:46ch;margin:0 auto}

  /* ---------- order detail ---------- */
  .detail-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;font-weight:500;margin-bottom:6px}
  .back:hover{color:var(--ink)}
  .line-item{display:flex;gap:14px;padding:16px 18px;align-items:center}
  .line-item img{width:52px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:none}
  .line-item .li-t{font-weight:600}
  .line-item .li-s{color:var(--faint);font-size:12.5px;margin-top:2px}
  .line-item .li-p{margin-left:auto;text-align:right;white-space:nowrap}
  .totals{padding:14px 18px;border-top:1px solid var(--line-soft)}
  .totals .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--sub)}
  .totals .row.grand{color:var(--ink);font-weight:700;font-size:15px;border-top:1px solid var(--line-soft);
    margin-top:6px;padding-top:10px}
  .kv{padding:14px 18px;font-size:13px}
  .kv dt{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin-top:13px}
  .kv dt:first-child{margin-top:0}
  .kv dd{margin-top:3px;word-break:break-word}
  .status-actions{padding:14px 18px;display:flex;flex-direction:column;gap:9px}
  .status-actions select{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;
    background:#0f0f0f;color:var(--ink);
  }
  .status-actions select:focus{outline:none;border-color:var(--accent-edge)}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#4fd99a;
    background:rgba(80,220,150,.1);border:1px solid rgba(80,220,150,.22);border-radius:8px;padding:5px 9px;margin-top:8px}

  .prod{display:flex;gap:18px;padding:18px;align-items:flex-start;flex-wrap:wrap}
  .prod img{width:110px;border-radius:10px;border:1px solid var(--border)}
  .prod h3{font-size:15px;font-weight:600}
  .prod .meta{color:var(--sub);font-size:13px;margin-top:6px;max-width:60ch}
  .prod dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:16px}
  .prod dt{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em}
  .prod dd{margin-top:3px;font-size:13.5px}

  .banner{background:rgba(255,107,94,.1);border:1px solid rgba(255,107,94,.28);color:var(--danger);
    border-radius:var(--radius);padding:13px 15px;font-size:13px;margin-bottom:16px;display:none}
  .banner code{background:rgba(0,0,0,.4);border-radius:5px;padding:1px 6px}

  /* ---------- sign in ---------- */
  .login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:50}
  /* display:grid above outranks the browser's own [hidden]{display:none}, so
     without this the overlay stays on screen after a successful sign-in and
     the dashboard is unreachable. */
  .login[hidden]{display:none}
  .login-card{width:100%;max-width:368px;background:var(--surface);border:1px solid var(--border);
    border-radius:18px;box-shadow:var(--shadow);padding:30px 28px}
  .login-brand{display:flex;align-items:center}
  .login-brand .mark{width:150px;margin:-6px 0 -4px -8px}
  .login h2{font-size:18px;font-weight:600;margin-top:22px;letter-spacing:-.015em}
  .login .sub{color:var(--sub);font-size:13px;margin-top:4px}
  .login .field{margin-top:16px}
  .login label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--sub)}
  .login input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    font:inherit;font-size:14px;background:#0f0f0f;color:var(--ink)}
  .login input:focus{outline:none;border-color:var(--accent-edge);box-shadow:0 0 0 3px rgba(168,232,49,.12)}
  .login button{width:100%;margin-top:20px;padding:10px 12px}
  .login .err{background:rgba(255,107,94,.1);border:1px solid rgba(255,107,94,.28);color:var(--danger);
    border-radius:10px;padding:10px 12px;font-size:13px;margin-top:16px;display:none}
  .who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--sub);font-size:12px;
    padding:12px 0 0;border-top:1px solid var(--border);margin-top:12px}
  /* Side by side, a username the length of the real one squeezed both halves
     until each broke across two lines. The sidebar is not wide enough to fit
     them on one row without truncating the name, so they get a row each. */
  .who .lbl{flex:1 1 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who b{color:var(--ink);font-weight:600}
  .who button{flex:none;white-space:nowrap;
    background:var(--surface-2);border:1px solid var(--border);color:var(--sub);
    border-radius:8px;padding:5px 12px;font-size:11.5px}
  .who button:hover{background:#262626;color:var(--ink)}

  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    /* The sidebar becomes a header. It wraps onto two rows rather than
       scrolling sideways: a scrolling nav hid Products and Customers off the
       right edge of a phone with nothing to indicate they were there. */
    .side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;overflow:visible;
      padding:10px 12px;border-right:none;border-bottom:1px solid var(--border)}
    .side-brand{order:0;padding:0;border-bottom:none}
    .side-brand .mark{width:104px}
    .side-sec{display:none}
    .side nav{order:2;flex:1 0 100%;flex-direction:row;flex-wrap:wrap;gap:6px;padding:0}
    .side nav a{white-space:nowrap;padding:7px 11px;gap:8px;font-size:13.5px}
    .side nav a.on::before,.side nav a.on::after{display:none}
    .side nav .ico{width:26px;height:26px}
    .side nav svg{width:15px;height:15px}
    .side nav .count{margin-left:0}
    /* Sign out was unreachable on a phone — the whole footer was hidden. Only
       the storefront blurb goes; the control itself moves up beside the brand. */
    .side-foot{order:1;display:block;margin:0 0 0 auto;padding:0;border-top:none;width:auto}
    .foot-note{display:none}
    .who{margin:0;padding:0;border-top:none;gap:0}
    .who .lbl{display:none}
    .content{padding:18px 14px 54px}
    .topbar{padding:0 14px;min-height:62px}
  }
  /* Four stacked KPI cards pushed the orders table off a phone screen. */
  @media(max-width:600px){
    .kpis{grid-template-columns:1fr 1fr;gap:10px}
    .kpi{padding:14px}
    .kpi .value{font-size:21px}
    .kpi .label,.kpi .foot{font-size:11.5px}
    /* The table keeps its sideways scroll — it is a data table and that is
       the honest way to show six columns on a phone — but tighter cells fit
       more per swipe, and an order ID must never break across two lines. */
    th,td{padding:11px 12px}
    table{min-width:560px}
    td .id{white-space:nowrap}
    .card-head,.toolbar{padding-left:14px;padding-right:14px}
    .detail-grid{gap:12px}
  }
</style>
</head>
<body>
<!-- Brand mark. Defined once and referenced twice (sidebar + sign-in) so the
     gradients are not duplicated; <use> clones inherit the CSS animations that
     match the originals. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="pm-chrome" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#43434b"/><stop offset="18%" stop-color="#e9ecf2"/>
      <stop offset="30%" stop-color="#99a0ab"/><stop offset="44%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#6c7480"/><stop offset="74%" stop-color="#dfe4ec"/>
      <stop offset="88%" stop-color="#3b4048"/><stop offset="100%" stop-color="#b9c0cb"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.85 0; 0.85 0; -0.85 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="pm-star" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#c4cad4"/>
      <stop offset="55%" stop-color="#ffffff"/><stop offset="78%" stop-color="#8e96a3"/>
      <stop offset="100%" stop-color="#f2f5fa"/>
    </linearGradient>
    <filter id="pm-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <g id="pmark">

<div class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <div class="login-brand"><svg class="mark" viewBox="-132 -88 264 176" role="img" aria-label="Phenomenal"><use href="#pmark"/></svg></div>
    <h2>Sign in</h2>
    <p class="sub">Owner access to orders and customers.</p>
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="err" id="login-err"></div>
    <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
  </form>
</div>

<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="side-brand"><svg class="mark" viewBox="-132 -88 264 176" role="img" aria-label="Phenomenal"><use href="#pmark"/></svg></div>
    <div class="side-sec">Main menu</div>
    <nav id="nav">
      <a href="#/home" data-view="home">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg></span> Home</a>
      <a href="#/orders" data-view="orders">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9.5 7V5.5a2.5 2.5 0 0 1 5 0V7"/></svg></span>
        Orders <span class="count" id="nav-orders">0</span></a>
      <a href="#/products" data-view="products">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5v-7Z"/><path d="m4 8.5 8 4.5 8-4.5"/><path d="M12 13v7"/></svg></span> Products</a>
      <a href="#/customers" data-view="customers">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.8 20c.8-3.6 3.7-5.4 7.2-5.4s6.4 1.8 7.2 5.4"/></svg></span>
        Customers <span class="count" id="nav-customers">0</span></a>
    </nav>
    <div class="side-foot">
      <p class="foot-note">Storefront <a href="/" target="_blank" rel="noopener">View store</a><br>
      Orders arrive here the moment a customer checks out.</p>
      <div class="who"><span class="lbl">Signed in as <b id="who">—</b></span><button type="button" id="signout">Sign out</button></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Home</h1>
      <span class="spacer"></span>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="export">Export CSV</button>
    </div>
    <div class="content">
      <div class="banner" id="banner">Can't reach the store API. Is the server running? <code>node server.js</code></div>
      <div id="view"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // CSS handles the rest of the mark, but the gradient sweep is SMIL and a
  // media query cannot reach it.
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    var defs = document.querySelector('svg[aria-hidden="true"]');
    if(defs && defs.pauseAnimations) defs.pauseAnimations();
  }
  var STATUSES = ["pending","confirmed","shipped","delivered","cancelled"];
  var NEXT = {pending:"confirmed", confirmed:"shipped", shipped:"delivered"};
  var state = {orders:[], customers:[], products:[], stats:{}, filter:"all", q:""};

  var $ = function(s){ return document.querySelector(s); };
  function esc(v){ var d=document.createElement("div"); d.textContent = v==null?"":String(v); return d.innerHTML; }
  function money(n){ return "Rs " + (n||0).toLocaleString("en-PK"); }
  function when(iso){
    var d = new Date(iso);
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + ", " +
           d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }
  function pill(s){ return '<span class="pill '+esc(s)+'">'+esc(s)+'</span>'; }

  /* ---------- data ---------- */
  function grab(url){
    return fetch(url).then(function(r){
      if(r.status === 401){ var e = new Error("unauthorised"); e.auth = true; throw e; }
      return r.json();
    });
  }
  function load(){
    return Promise.all([
      grab("/api/orders"), grab("/api/stats"), grab("/api/products"), grab("/api/customers")
    ]).then(function(res){
      state.orders = res[0]; state.stats = res[1]; state.products = res[2]; state.customers = res[3];
      $("#banner").style.display = "none";
      $("#nav-orders").textContent = state.orders.length;
      $("#nav-customers").textContent = state.customers.length;
      render();
    }).catch(function(err){
      if(err && err.auth) return showLogin();      // session expired mid-session
      $("#banner").style.display = "block";
    });
  }

  /* ---------- sign in ---------- */
  function showLogin(msg){
    $("#app").style.display = "none";
    $("#login").hidden = false;
    var box = $("#login-err");
    box.textContent = msg || "";
    box.style.display = msg ? "block" : "none";
    var u = $("#u"); if(u && !u.value) u.focus();
  }
  function showApp(user){
    $("#login").hidden = true;
    $("#app").style.display = "";
    $("#who").textContent = user;
    load();
  }
  $("#login-form").addEventListener("submit", function(e){
    e.preventDefault();
    var btn = $("#login-btn");
    btn.disabled = true; btn.textContent = "Signing in…";
    fetch("/api/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username: $("#u").value, password: $("#pw").value})
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        btn.disabled = false; btn.textContent = "Sign in";
        if(res.ok){ $("#pw").value = ""; showApp(res.d.user); }
        else showLogin(res.d.error || "Could not sign in.");
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = "Sign in";
        showLogin("Can't reach the server. Is it running?");
      });
  });
  $("#signout").addEventListener("click", function(){
    fetch("/api/logout", {method:"POST"}).then(function(){ showLogin(); });
  });

  /* ---------- views ---------- */
  function emptyState(title, msg){
    return '<div class="card"><div class="empty">'+
      '<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9.5 7V5.5a2.5 2.5 0 0 1 5 0V7"/></svg>'+
      '<h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p></div></div>';
  }

  function kpiRow(){
    var s = state.stats;
    return '<div class="kpis">'+
      kpi("Total sales", money(s.revenue), "Excludes cancelled orders")+
      kpi("Orders", s.orders||0, (s.last7||0)+" in the last 7 days")+
      kpi("Units sold", s.units||0, "Across all sizes")+
      kpi("Average order", money(s.aov), "Per completed order")+
    '</div>';
  }
  function kpi(label, value, foot){
    return '<div class="kpi"><div class="label">'+esc(label)+'</div>'+
      '<div class="value tnum">'+esc(value)+'</div><div class="foot">'+esc(foot)+'</div></div>';
  }

  function ordersTable(list, showAll){
    if(!list.length){
      return emptyState("No orders here yet",
        showAll ? "As soon as someone checks out on the storefront, their order lands in this list."
                : "No orders match this filter.");
    }
    var rows = list.map(function(o){
      return '<tr class="click" data-id="'+esc(o.id)+'">'+
        '<td><span class="id">'+esc(o.id)+'</span></td>'+
        '<td class="muted">'+esc(when(o.created_at))+'</td>'+
        '<td>'+esc(o.name || "Guest")+'<div class="muted">'+esc(o.phone || o.email || "no contact")+'</div></td>'+
        '<td class="muted">'+esc(o.size)+' &times; '+esc(o.qty)+'</td>'+
        '<td class="tnum">'+esc(money(o.total))+'</td>'+
        '<td>'+pill(o.status)+'</td>'+
      '</tr>';
    }).join("");
    return '<div class="tbl-wrap"><table><thead><tr>'+
      '<th>Order</th><th>Date</th><th>Customer</th><th>Item</th><th>Total</th><th>Status</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  function viewHome(){
    var recent = state.orders.slice(0,5);
    return kpiRow()+
      '<div class="card"><div class="card-head"><h2>Recent orders</h2><span class="spacer"></span>'+
      '<a href="#/orders">View all</a></div>'+ordersTable(recent, true)+'</div>';
  }

  function viewOrders(){
    var list = state.orders.filter(function(o){
      if(state.filter !== "all" && o.status !== state.filter) return false;
      if(!state.q) return true;
      var hay = [o.id,o.name,o.phone,o.email,o.address,o.size].join(" ").toLowerCase();
      return hay.indexOf(state.q.toLowerCase()) > -1;
    });
    var tabs = ["all"].concat(STATUSES).map(function(f){
      var n = f==="all" ? state.orders.length : ((state.stats.by_status||{})[f]||0);
      return '<button data-filter="'+f+'" class="'+(state.filter===f?"on":"")+'">'+
        f.charAt(0).toUpperCase()+f.slice(1)+' ('+n+')</button>';
    }).join("");
    return '<div class="card"><div class="tabs" id="tabs">'+tabs+'</div>'+
      '<div class="toolbar"><input id="q" type="search" placeholder="Search order ID, name, phone, email or address" value="'+esc(state.q)+'"></div>'+
      ordersTable(list, state.filter==="all" && !state.q)+'</div>';
  }

  function viewOrder(id){
    var o = state.orders.filter(function(x){ return x.id === id; })[0];
    if(!o) return emptyState("Order not found", "It may have been removed from the order log.");
    var img = (state.products[0] && state.products[0].image) || "assets/product.jpg";
    var next = NEXT[o.status];
    return '<a class="back" href="#/orders">&larr; Orders</a>'+
      '<div class="card-head" style="padding:6px 0 16px;border:none">'+
        '<h2 style="font-size:19px">'+esc(o.id)+'</h2>'+pill(o.status)+
        '<span class="muted" style="color:var(--faint);font-size:12.5px">'+esc(when(o.created_at))+'</span>'+
      '</div>'+
      '<div class="detail-grid">'+
        '<div style="display:flex;flex-direction:column;gap:14px">'+
          '<div class="card"><div class="card-head"><h2>Item</h2></div>'+
            '<div class="line-item"><img src="'+esc(img)+'" alt="">'+
              '<div><div class="li-t">'+esc(o.product)+'</div>'+
              '<div class="li-s">Size '+esc(o.size)+' &middot; '+esc(money(o.unit_price))+' each</div></div>'+
              '<div class="li-p"><div>&times; '+esc(o.qty)+'</div>'+
              '<div class="muted tnum">'+esc(money(o.total))+'</div></div>'+
            '</div>'+
            '<div class="totals">'+
              '<div class="row"><span>Subtotal</span><span class="tnum">'+esc(money(o.total))+'</span></div>'+
              '<div class="row"><span>Shipping</span><span>Free</span></div>'+
              '<div class="row grand"><span>Total &middot; cash on delivery</span><span class="tnum">'+esc(money(o.total))+'</span></div>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:14px">'+
          '<div class="card"><div class="card-head"><h2>Status</h2></div>'+
            '<div class="status-actions">'+
              (next ? '<button class="btn btn-primary" data-advance="'+esc(next)+'">Mark as '+esc(next)+'</button>' : '')+
              '<select id="status-select" aria-label="Order status">'+
                STATUSES.map(function(st){
                  return '<option value="'+st+'"'+(st===o.status?" selected":"")+'>'+st+'</option>';
                }).join("")+
              '</select>'+
              (o.updated_at ? '<div class="muted" style="color:var(--faint);font-size:12px">Updated '+esc(when(o.updated_at))+'</div>' : '')+
              '<button class="btn btn-danger" data-delete="'+esc(o.id)+'">Delete order</button>'+
              // Whether the Conversions API Purchase for this order actually
              // reached Meta, so it can be checked here rather than guessed at.
              (function(){
                var c = o.capi;
                if(!c) return '<div class="muted" style="color:var(--faint);font-size:12px">Purchase not reported yet</div>';
                if(c.purchase_sent_at) return '<div class="muted" style="color:var(--faint);font-size:12px">Purchase reported to Meta '+esc(when(c.purchase_sent_at))+'</div>';
                if(c.skipped) return '<div class="muted" style="color:var(--faint);font-size:12px">Purchase not sent: '+esc(c.skipped)+'</div>';
                return '<div class="muted" style="color:var(--danger);font-size:12px">Purchase failed: '+esc(c.error || "unknown")+'</div>';
              })()+
            '</div>'+
          '</div>'+
          '<div class="card"><div class="card-head"><h2>Customer</h2></div>'+
            '<dl class="kv">'+
              '<dt>Name</dt><dd>'+esc(o.name || "Not given")+'</dd>'+
              '<dt>Contact</dt><dd>'+esc(o.phone || "Not given")+'</dd>'+
              '<dt>Email</dt><dd>'+esc(o.email || "Not given")+'</dd>'+
              '<dt>Delivery address</dt><dd>'+esc(o.address || "Not given")+'</dd>'+
              '<dt>Channel</dt><dd>'+esc(o.channel || "web")+'</dd>'+
            '</dl>'+
            (o.marketing_opt_in ? '<div style="padding:0 16px 14px"><span class="flag">Opted in to updates and offers</span></div>' : '')+
          '</div>'+
        '</div>'+
      '</div>';
  }

  function viewProducts(){
    if(!state.products.length) return emptyState("No products", "The catalog is empty.");
    var p = state.products[0];
    var sold = state.stats.units || 0;
    return '<div class="card"><div class="card-head"><h2>Product</h2></div>'+
      '<div class="prod"><img src="'+esc(p.image)+'" alt="">'+
        '<div style="flex:1;min-width:220px">'+
          '<h3>'+esc(p.title)+'</h3>'+
          '<div class="meta">'+esc(p.description)+'</div>'+
          '<dl>'+
            '<div><dt>Price</dt><dd class="tnum">'+esc(money(p.price))+'</dd></div>'+
            '<div><dt>Shipping</dt><dd>'+(p.free_shipping?"Free nationwide":"Charged")+'</dd></div>'+
            '<div><dt>Fabric</dt><dd>'+esc(p.fabric)+'</dd></div>'+
            '<div><dt>Colour</dt><dd>'+esc(p.color)+'</dd></div>'+
            '<div><dt>Sizes</dt><dd>'+esc((p.sizes||[]).join(", "))+'</dd></div>'+
            '<div><dt>Units sold</dt><dd class="tnum">'+esc(sold)+'</dd></div>'+
          '</dl>'+
        '</div>'+
      '</div></div>';
  }

  function viewCustomers(){
    if(!state.customers.length){
      return emptyState("No customers yet", "Customers appear here automatically, built from the orders they place.");
    }
    var rows = state.customers.map(function(c){
      return '<tr>'+
        '<td>'+esc(c.name || "Guest")+(c.marketing_opt_in?' <span class="pill delivered" style="font-size:11px">subscribed</span>':'')+'</td>'+
        '<td class="muted">'+esc(c.phone || "—")+'</td>'+
        '<td class="muted">'+esc(c.email || "—")+'</td>'+
        '<td class="tnum">'+esc(c.orders)+'</td>'+
        '<td class="tnum">'+esc(money(c.spent))+'</td>'+
        '<td class="muted">'+esc(when(c.last_order))+'</td>'+
      '</tr>';
    }).join("");
    return '<div class="card"><div class="tbl-wrap"><table><thead><tr>'+
      '<th>Customer</th><th>Phone</th><th>Email</th><th>Orders</th><th>Spent</th><th>Last order</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }

  /* ---------- routing ---------- */
  function route(){
    var h = (location.hash || "#/home").replace(/^#\//,"").split("/");
    return {view: h[0] || "home", id: h[1] || null};
  }
  function render(){
    var r = route(), html, title;
    if(r.view === "orders" && r.id){ html = viewOrder(r.id); title = "Order " + r.id; }
    else if(r.view === "orders"){ html = viewOrders(); title = "Orders"; }
    else if(r.view === "products"){ html = viewProducts(); title = "Products"; }
    else if(r.view === "customers"){ html = viewCustomers(); title = "Customers"; }
    else { html = viewHome(); title = "Home"; }
    $("#view").innerHTML = html;
    $("#page-title").textContent = title;
    document.querySelectorAll("#nav a").forEach(function(a){
      a.classList.toggle("on", a.dataset.view === (r.view || "home"));
    });
    $("#export").style.display = (r.view === "orders" && !r.id) ? "" : "none";
  }
  window.addEventListener("hashchange", render);

  /* ---------- interactions ---------- */
  $("#view").addEventListener("click", function(e){
    var row = e.target.closest("tr.click");
    if(row){ location.hash = "#/orders/" + row.dataset.id; return; }
    var tab = e.target.closest("[data-filter]");
    if(tab){ state.filter = tab.dataset.filter; render(); return; }
    var adv = e.target.closest("[data-advance]");
    if(adv){ setStatus(route().id, adv.dataset.advance); }
    var del = e.target.closest("[data-delete]");
    if(del){ removeOrder(del.dataset.delete); }
  });
  $("#view").addEventListener("input", function(e){
    if(e.target.id === "q"){
      state.q = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var box = $("#q"); if(box){ box.focus(); box.setSelectionRange(pos,pos); }
    }
  });
  $("#view").addEventListener("change", function(e){
    if(e.target.id === "status-select") setStatus(route().id, e.target.value);
  });

  // Used to clear test rows. Permanent, and a Purchase already reported to
  // Meta stays reported — deleting the row here cannot take it back.
  function removeOrder(id){
    var o = state.orders.filter(function(x){ return x.id === id; })[0];
    var reported = o && o.capi && o.capi.purchase_sent_at;
    if(!confirm("Delete order " + id + " for good?" +
      (reported ? "\n\nThis order already reported a Purchase to Meta. Deleting it here does not withdraw that event." : ""))) return;
    fetch("/api/orders/"+id, {method:"DELETE"}).then(function(){
      location.hash = "#/orders";
      load();
    });
  }

  function setStatus(id, status){
    fetch("/api/orders/"+id, {
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({status: status})
    }).then(load);
  }

  $("#refresh").addEventListener("click", load);
  $("#export").addEventListener("click", function(){
    var cols = ["id","created_at","status","product","size","qty","unit_price","total","name","phone","email","address","marketing_opt_in","channel"];
    var csv = [cols.join(",")].concat(state.orders.map(function(o){
      return cols.map(function(c){
        var v = o[c] == null ? "" : String(o[c]);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
      }).join(",");
    })).join("\n");
    var url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    var a = document.createElement("a");
    a.href = url; a.download = "phenomenal-orders.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  fetch("/api/me")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ d ? showApp(d.user) : showLogin(); })
    .catch(function(){ showLogin(); });

  setInterval(function(){ if(!$("#login").hidden) return; load(); }, 20000);
})();
</script>
</body>
</html>
