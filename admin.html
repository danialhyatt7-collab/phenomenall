<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phenomenal Orders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Crimson+Pro:wght@400;600&display=swap">
<style>
  :root{
    --ink:#0D0A07; --panel:#171108; --line:rgba(217,151,63,.22);
    --cream:#F0E6D2; --dim:#C9BBA0; --muted:#9A8A70; --amber:#D9973F; --wa:#25D366;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--cream);font-family:'Crimson Pro',Georgia,serif;font-size:1.05rem;padding:2rem 1.5rem}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase}
  h1 span{color:var(--amber)}
  .sub{color:var(--muted);margin:.3rem 0 1.8rem}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:2rem}
  .stat{background:var(--panel);padding:1.2rem 1.3rem}
  .stat b{display:block;font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th{font-family:'Oswald',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);text-align:left;padding:.8rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
  td{padding:.8rem 1rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tr:hover td{background:rgba(217,151,63,.05)}
  .pill{font-family:'Oswald',sans-serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:.25rem .6rem;border-radius:2px;border:1px solid var(--line)}
  .pill.pending{color:var(--amber);border-color:var(--amber)}
  .pill.confirmed{color:#7EC8E3;border-color:#7EC8E3}
  .pill.shipped{color:#C9A6F0;border-color:#C9A6F0}
  .pill.delivered{color:var(--wa);border-color:var(--wa)}
  .pill.cancelled{color:var(--muted);text-decoration:line-through}
  select{background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:2px;font-family:'Oswald',sans-serif;font-size:.8rem;padding:.35rem .5rem}
  .empty{padding:3rem 1rem;text-align:center;color:var(--muted)}
  .err{color:#E07A5F;padding:1rem;border:1px solid #E07A5F;margin-bottom:1rem;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Phenomenal — Orders</h1>
  <p class="sub">Every WhatsApp checkout is recorded here the moment the customer taps "Send Order".</p>
  <p class="err" id="err">Couldn't reach the API — is the server running? (node server.js)</p>
  <div class="stats">
    <div class="stat"><b id="s-orders">—</b><span>Orders</span></div>
    <div class="stat"><b id="s-pending">—</b><span>Pending</span></div>
    <div class="stat"><b id="s-units">—</b><span>Units sold</span></div>
    <div class="stat"><b id="s-revenue">—</b><span>Revenue</span></div>
  </div>
  <div class="tbl-scroll">
    <table>
      <thead><tr><th>Order</th><th>Placed</th><th>Item</th><th>Size</th><th>Qty</th><th>Total</th><th>Customer</th><th>Status</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
<script>
(function(){
  "use strict";
  var fmt = function(n){ return "Rs " + n.toLocaleString("en-PK"); };
  var STATUSES = ["pending","confirmed","shipped","delivered","cancelled"];

  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

  function load(){
    Promise.all([
      fetch("/api/orders").then(function(r){return r.json();}),
      fetch("/api/stats").then(function(r){return r.json();})
    ]).then(function(res){
      var orders = res[0], stats = res[1];
      document.getElementById("s-orders").textContent = stats.orders;
      document.getElementById("s-pending").textContent = stats.pending;
      document.getElementById("s-units").textContent = stats.units;
      document.getElementById("s-revenue").textContent = fmt(stats.revenue);
      var tbody = document.getElementById("rows");
      if(!orders.length){
        tbody.innerHTML = '<tr><td colspan="8" class="empty">No orders yet. They\'ll appear here as customers check out.</td></tr>';
        return;
      }
      tbody.innerHTML = orders.map(function(o){
        var opts = STATUSES.map(function(s){
          return '<option value="'+s+'"'+(s===o.status?" selected":"")+'>'+s+'</option>';
        }).join("");
        return '<tr>'+
          '<td>'+esc(o.id)+'</td>'+
          '<td>'+new Date(o.created_at).toLocaleString()+'</td>'+
          '<td>'+esc(o.product)+'</td>'+
          '<td>'+esc(o.size)+'</td>'+
          '<td>'+o.qty+'</td>'+
          '<td>'+fmt(o.total)+'</td>'+
          '<td>'+esc([o.name,o.city].filter(Boolean).join(" · ") || "—")+'</td>'+
          '<td><span class="pill '+esc(o.status)+'">'+esc(o.status)+'</span> '+
              '<select data-id="'+esc(o.id)+'" aria-label="Update status">'+opts+'</select></td>'+
        '</tr>';
      }).join("");
      tbody.querySelectorAll("select").forEach(function(sel){
        sel.addEventListener("change", function(){
          fetch("/api/orders/"+sel.dataset.id, {
            method:"PATCH", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({status: sel.value})
          }).then(load);
        });
      });
    }).catch(function(){
      document.getElementById("err").style.display = "block";
    });
  }
  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
